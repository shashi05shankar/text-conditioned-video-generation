# BASELINE: conditional VAE whose 16 frames are decoded independently.
# The control in this project's central comparison -- identical to the ConvLSTM config
# in every respect except `model.name`.

run_name: baseline
seed: 42

data:
  root: data/processed
  train_split: train
  val_split: val
  num_workers: 2

model:
  name: baseline
  text_dim: 512        # frozen CLIP ViT-B/32 embedding size
  cond_dim: 128        # text embedding is projected down to this before conditioning
  latent_dim: 128      # one global latent per clip: carries digit style + motion
  feature_dim: 256     # video-encoder output width
  base_ch: 128         # channels at the 4x4 decoder bottleneck
  encoder_base_ch: 32
  frame_emb_dim: 64    # learned per-frame-index embedding
  num_frames: 16
  hidden_dim: 512      # width of the per-frame bottleneck MLP.
                       # Set to 1500 for the capacity-matched control run.

train:
  max_steps: 20000
  batch_size: 32
  lr: 0.0002
  recon_loss: mse

  # KL weight. Reconstruction is a per-pixel mean (~0.01-0.02 once trained) while KL is
  # summed over 128 latent dims (~20-60 nats), so an unscaled beta=1 would swamp
  # reconstruction entirely and collapse the posterior. 1e-4 puts the KL term at roughly
  # 10-40% of total loss -- strong enough to keep the prior usable for generation,
  # weak enough that the model still learns to reconstruct.
  kl_weight: 0.0001
  kl_warmup_steps: 2000   # ramp in from 0; full KL at step 0 causes posterior collapse
  free_bits: 0.02         # nats/dim that incur no penalty; stops unused dims collapsing

  grad_clip: 1.0
  log_every: 50
  eval_every: 1000
  max_eval_batches: 20

  # Colab/Kaggle sessions disconnect without warning, so save on a wall-clock timer as
  # well as a step interval.
  save_every_steps: 2000
  save_every_minutes: 10
  keep_last: 2

output:
  run_dir: outputs/runs/baseline
