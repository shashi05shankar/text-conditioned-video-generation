# MAIN MODEL: conditional VAE whose 16 frames are produced by a ConvLSTM decoder.
#
# Byte-for-byte identical to configs/train_baseline.yaml except for `model.name` and
# the added `hidden_ch`. Same seed, same optimiser, same KL schedule, same step budget.
# That is deliberate: the only free variable in the comparison is the temporal
# mechanism, so any measured difference is attributable to it.

run_name: convlstm
seed: 42

data:
  root: data/processed
  train_split: train
  val_split: val
  num_workers: 2

model:
  name: convlstm
  text_dim: 512
  cond_dim: 128
  latent_dim: 128
  feature_dim: 256
  base_ch: 128
  encoder_base_ch: 32
  frame_emb_dim: 64
  num_frames: 16
  hidden_ch: 128       # ConvLSTM hidden/cell state channels, at 4x4 spatial resolution

train:
  max_steps: 20000
  batch_size: 32
  lr: 0.0002
  recon_loss: mse

  kl_weight: 0.0001
  kl_warmup_steps: 2000
  free_bits: 0.02

  grad_clip: 1.0
  log_every: 50
  eval_every: 1000
  max_eval_batches: 20

  save_every_steps: 2000
  save_every_minutes: 10
  keep_last: 2

output:
  run_dir: outputs/runs/convlstm
