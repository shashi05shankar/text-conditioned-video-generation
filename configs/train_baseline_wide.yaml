# CAPACITY-MATCHED BASELINE (optional ablation).
#
# The ConvLSTM model carries ~6.50M parameters against the standard baseline's ~4.27M,
# because the recurrent cell and its state projection add ~2.2M. That gap invites an
# obvious objection: maybe the ConvLSTM wins on capacity, not on temporal modelling.
#
# This config widens the baseline's per-frame bottleneck MLP (hidden_dim 512 -> 1500) to
# bring its parameter count close to the ConvLSTM's, while keeping it strictly
# frame-independent. If the ConvLSTM still wins here, capacity is ruled out as the
# explanation.
#
# Everything else is identical to configs/train_baseline.yaml.

run_name: baseline_wide
seed: 42

data:
  root: data/processed
  train_split: train
  val_split: val
  num_workers: 2

model:
  name: baseline
  text_dim: 512
  cond_dim: 128
  latent_dim: 128
  feature_dim: 256
  base_ch: 128
  encoder_base_ch: 32
  frame_emb_dim: 64
  num_frames: 16
  hidden_dim: 1500     # the only change vs train_baseline.yaml

train:
  max_steps: 20000
  batch_size: 32
  lr: 0.0002
  recon_loss: mse

  kl_weight: 0.0001
  kl_warmup_steps: 2000
  free_bits: 0.02

  grad_clip: 1.0
  log_every: 50
  eval_every: 1000
  max_eval_batches: 20

  save_every_steps: 2000
  save_every_minutes: 10
  keep_last: 2

output:
  run_dir: outputs/runs/baseline_wide
